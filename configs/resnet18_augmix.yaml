# D4: 40 epochs, confirmed at the end of Phase 07 from measured Colab time.
model: resnet18
strategy: augmix
seed: 0
epochs: 40
batch_size: 128
optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005
scheduler:
  name: cosine
amp: true
val_size: 5000
split_seed: 42
num_workers: 2
device: auto
subset: null
strategy_params:
  augmix:
    severity: 3
    mixture_width: 3
    chain_depth: -1
    alpha: 1.0
    all_ops: false
  corruption_aware:
    p: 0.5
    corruptions: [gaussian_noise, defocus_blur, contrast, jpeg_compression]
    severities: [1, 2, 3, 4, 5]
