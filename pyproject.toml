[project]
name = "cifar10-robustness-study"
version = "0.1.0"
description = "Robustness of CIFAR-10 classifiers to common corruptions (CIFAR-10-C)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
